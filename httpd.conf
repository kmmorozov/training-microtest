# Учебный минимальный основной конфиг Apache HTTP Server (RHEL-like).
# Комментарии вынесены на отдельные строки: Apache не поддерживает inline #.
# Установка: сначала сохраните штатный /etc/httpd/conf/httpd.conf, затем проверьте
# копию командой httpd -t и только после этого перезагружайте службу.

# Корневая директория определяет базу для всех относительных путей ниже.
ServerRoot "/etc/httpd"
# HTTP слушает все адреса. Для локального теста можно указать 127.0.0.1:80.
Listen 80
# Подключаем DSO-модули пакета до использования их директив.
Include conf.modules.d/*.conf
# Рабочий процесс сбрасывает root-привилегии до системной учетной записи apache.
User apache
Group apache
# Адрес администратора попадает в некоторые страницы ошибок.
ServerAdmin root@localhost
# Явное имя исключает предупреждение о невозможности определить FQDN.
ServerName app.example.test

# По умолчанию запрещаем HTTP-доступ ко всей файловой системе.
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Публикуется только каталог сайта. Indexes включен в учебных целях: в production
# обычно его удаляют, чтобы не показывать листинг каталога без index-файла.
DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    # .htaccess отключен: правила должны находиться в централизованном конфиге.
    AllowOverride None
    Require all granted
</Directory>

# Относительный путь разрешается относительно ServerRoot (/etc/httpd).
ErrorLog "logs/error_log"
LogLevel warn
# Локальные virtual host и модульные настройки подключаются последними.
# IncludeOptional не завершает запуск ошибкой, если каталог пуст или отсутствует.
IncludeOptional conf.d/*.conf
