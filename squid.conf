# Минимальный forward proxy Squid для учебной сети RFC 5737.
# Перед установкой замените localnet; проверьте: squid -k parse -f ./squid.conf.
# ACL вычисляются сверху вниз в http_access, поэтому порядок правил критичен.

# Прокси принимает явные HTTP proxy-соединения на всех адресах порта 3128.
# Ограничение доступа ниже обязательно; при желании привяжите конкретный IP.
http_port 3128
# Только клиенты учебного сегмента получат доступ.
acl localnet src 192.0.2.0/24
# Демонстрационный домен блокируется вместе со всеми поддоменами.
acl blocked dstdomain .blocked.example.test
# CONNECT разрешен только к TLS-порту, обычные запросы — только к 80 и 443.
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Сначала отклоняем небезопасные порты и запрещенный домен, затем разрешаем LAN.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked
http_access allow localnet
# Явный deny all предотвращает превращение сервера в открытый прокси.
http_access deny all

# stdio пишет стандартный access.log; кэш отключен для предсказуемости лаборатории.
access_log stdio:/var/log/squid/access.log
cache deny all
