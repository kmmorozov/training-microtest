# Полный /etc/dovecot/dovecot.conf для Dovecot 2.3, local UNIX users.
# Не применять поверх iRedMail; здесь отдельный учебный IMAPS Maildir.
protocols = imap
listen = *
mail_location = maildir:~/Maildir
first_valid_uid = 1000
auth_mechanisms = plain login
disable_plaintext_auth = yes
# PAM проверяет пароль, passwd возвращает UID/GID/home пользователя ОС.
passdb {
    driver = pam
}
userdb {
    driver = passwd
}
namespace inbox {
    inbox = yes
    separator = /
}
ssl = required
# Символ < означает чтение содержимого PEM (только синтаксис 2.3).
ssl_cert = </etc/dovecot/private/mail.crt
ssl_key = </etc/dovecot/private/mail.key
service imap-login {
    inet_listener imap {
        port = 0
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}
