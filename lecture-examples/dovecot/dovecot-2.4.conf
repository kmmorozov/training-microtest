# Полный /etc/dovecot/dovecot.conf для Dovecot 2.4, local UNIX users.
# Номера синтаксиса/хранилища обязательны; не смешивать с конфигом 2.3.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols {
    imap = yes
}
listen = *
mail_driver = maildir
mail_path = ~/Maildir
first_valid_uid = 1000
auth_mechanisms = plain login
auth_allow_cleartext = no
# Отдельные named blocks для PAM и passwd в синтаксисе 2.4.
passdb pam {
}
userdb passwd {
}
namespace inbox {
    inbox = yes
    separator = /
}
ssl = required
ssl_server_cert_file = /etc/dovecot/private/mail.crt
ssl_server_key_file = /etc/dovecot/private/mail.key
service imap-login {
    inet_listener imap {
        port = 0
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}
