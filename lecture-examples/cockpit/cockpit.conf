# /etc/cockpit/cockpit.conf
# Локальный override минимальных web service свойств. Network source restriction
# выполняется firewall, а не этой парой настроек.
[WebService]
# Никогда не разрешать plain HTTP к management console.
AllowUnencrypted = false
# Не показывать поле подключения к произвольному другому host на login page.
LoginTo = false
