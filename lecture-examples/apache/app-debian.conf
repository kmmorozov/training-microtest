# Полный /etc/apache2/apache2.conf; запуск через apache2ctl/systemd с envvars пакета.
ServerRoot "/etc/apache2"
DefaultRuntimeDir ${APACHE_RUN_DIR}
PidFile ${APACHE_PID_FILE}
Listen 80
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}
ServerName app.example.test
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn
# Общий запрет доступа к filesystem снимается только для DocumentRoot VirtualHost.
<Directory />
    AllowOverride None
    Require all denied
</Directory>
DirectoryIndex index.html
# VirtualHost уже внутри основного файла; a2ensite для этого примера не нужен.
# В отличие от пакетного main явно определяем используемый формат access log.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
<VirtualHost *:80>
    ServerName app.example.test
    DocumentRoot /srv/www/app
    # Package variable помещает logs в системный Apache log directory.
    ErrorLog ${APACHE_LOG_DIR}/app-error.log
    CustomLog ${APACHE_LOG_DIR}/app-access.log combined
    <Directory /srv/www/app>
        # Явно разрешаем чтение document root и запрещаем .htaccess overrides.
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
