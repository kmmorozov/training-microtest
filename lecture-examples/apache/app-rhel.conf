# RHEL-like VirtualHost для /etc/httpd/conf.d/app.conf.
# До systemctl reload httpd: создать root/permissions и выполнить apachectl configtest.
<VirtualHost *:80>
    # Host header выбирает этот vhost.
    ServerName app.example.test
    DocumentRoot /srv/www/app
    # Относительные paths считаются от ServerRoot /etc/httpd.
    ErrorLog logs/app-error.log
    CustomLog logs/app-access.log combined
    <Directory /srv/www/app>
        # .htaccess не может менять policy; доступ разрешен только к этому root.
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
