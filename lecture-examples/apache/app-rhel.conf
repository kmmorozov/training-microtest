# Полный /etc/httpd/conf/httpd.conf; модули берутся из установленного httpd.
ServerRoot "/etc/httpd"
Listen 80
Include conf.modules.d/*.conf
User apache
Group apache
PidFile /run/httpd/httpd.pid
ServerName app.example.test
ErrorLog logs/error_log
LogLevel warn
# Общий запрет доступа к filesystem снимается только для DocumentRoot VirtualHost.
<Directory />
    AllowOverride None
    Require all denied
</Directory>
DirectoryIndex index.html
# VirtualHost уже включен в этот основной конфиг; отдельный conf.d не нужен.
# Имя combined определяем явно, поскольку пакетный основной файл заменен.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
<VirtualHost *:80>
    # Host header выбирает этот vhost.
    ServerName app.example.test
    DocumentRoot /srv/www/app
    # Относительные paths считаются от ServerRoot /etc/httpd.
    ErrorLog logs/app-error.log
    CustomLog logs/app-access.log combined
    <Directory /srv/www/app>
        # .htaccess не может менять policy; доступ разрешен только к этому root.
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
