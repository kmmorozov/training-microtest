# Полный /etc/nginx/nginx.conf, пример лекции; устанавливать целиком.
# Для Debian/Ubuntu замените nginx на www-data; MIME файл поставляет пакет nginx.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    # Backend слушает loopback и не должен быть доступен из внешней сети.
    upstream app_backend {
        # Здесь может быть несколько server для балансировки; lab использует один.
        server 127.0.0.1:8080;
        # Пул persistent connections уменьшает стоимость соединений с backend.
        keepalive 16;
    }

    server {
        listen 80;
        server_name app.example.test;
        location / {
            # URI передается named upstream; DNS lookup в этом примере не требуется.
            proxy_pass http://app_backend;
            # HTTP/1.1 необходим для reuse/keepalive к upstream.
            proxy_http_version 1.1;
            # Host и forwarding headers передают backend исходный client context.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Ограниченные timeouts не оставляют зависшие upstream connections навсегда.
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

}
