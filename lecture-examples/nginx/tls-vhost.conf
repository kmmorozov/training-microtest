# TLS virtual host app.example.test; certificate должен содержать этот DNS SAN.
# Private key mode 0600, fullchain содержит leaf и intermediate certificates.
server {
    # Сохраняем host/path/query при redirect HTTP → HTTPS.
    listen 80;
    server_name app.example.test;
    return 301 https://$host$request_uri;
}

server {
    # ssl включает TLS для listener; HTTP/2 зависит от версии Nginx и здесь не задан.
    listen 443 ssl;
    server_name app.example.test;
    root /srv/www/app;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    # Запрещаем устаревшие TLS protocol versions.
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { try_files $uri $uri/ =404; }
}
