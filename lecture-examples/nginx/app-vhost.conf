# Полный /etc/nginx/nginx.conf, пример лекции; устанавливать целиком.
# Для Debian/Ubuntu замените nginx на www-data; MIME файл поставляет пакет nginx.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    # До reload создать /srv/www/app, проверить права и выполнить nginx -t.
    server {
        # Один address:port может обслуживать несколько server_name по Host header.
        listen 80;
        server_name app.example.test;
        # Отдельный document root и журналы не смешивают приложения.
        root /srv/www/app;
        index index.html;
        access_log /var/log/nginx/app.access.log;
        error_log /var/log/nginx/app.error.log;
        # Только существующие files/directories; произвольного fallback здесь нет.
        location / { try_files $uri $uri/ =404; }
    }

}
