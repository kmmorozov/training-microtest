# Применяйте только после измерения и фиксации исходных значений.
# Установить отдельным файлом /etc/sysctl.d/60-service.conf и применить
# sysctl --system; затем прочитать effective values и повторить после reboot.
# IPv4 forwarding нужен только маршрутизатору/VPN gateway.
net.ipv4.ip_forward = 1
# Верхняя граница listen backlog; приложение также должно запросить достаточный backlog.
net.core.somaxconn = 4096
# Диапазон ephemeral source ports исходящих client connections.
net.ipv4.ip_local_port_range = 10240 65535
