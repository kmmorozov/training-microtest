# Клиентский профиль OpenVPN 2.6 для соединения с учебным сервером.
# DNS-имя, пути сертификатов и ключи должны быть заменены/установлены до запуска.
# Закрытый client.key храните с правами 0600 и никогда не коммитьте в Git.
client
# tun создает маршрутизируемый L3-интерфейс; сервер должен использовать тот же тип.
dev tun
proto udp
remote vpn.example.test 1194
# Клиент не привязан к фиксированному исходящему порту.
nobind
# Удостоверяющий центр проверяет сервер; cert/key аутентифицируют клиента.
ca /etc/openvpn/client/pki/ca.crt
cert /etc/openvpn/client/pki/client.crt
key /etc/openvpn/client/pki/client.key
# tls-crypt одновременно аутентифицирует и скрывает управляющий канал.
tls-crypt /etc/openvpn/client/pki/tls-crypt.key
# Дополнительные проверки защищают от сертификата клиента/другого узла вместо сервера.
remote-cert-tls server
verify-x509-name vpn.example.test name
# Список AEAD-шифров согласуется с сервером; ? допускает отсутствие ChaCha20 в сборке.
data-ciphers AES-256-GCM:AES-128-GCM:?CHACHA20-POLY1305
# Не перечитывать ключ и не пересоздавать tun при мягком перезапуске процесса.
persist-key
persist-tun
# verb 3 дает достаточно диагностики без чрезмерной отладочной выдачи.
verb 3
