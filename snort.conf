# Архивный минимальный пример ТОЛЬКО для Snort 2.x.
# Для Snort 3 используйте snort.lua; не смешивайте поколения конфигурации.
# Синтаксис зависит от установленных preprocessors/rules; проверяйте командой
# snort -T -c ./snort.conf -i <интерфейс> и не запускайте IDS вслепую.

# HOME_NET — защищаемый учебный сегмент, EXTERNAL_NET — все адреса вне него.
ipvar HOME_NET 192.0.2.0/24
ipvar EXTERNAL_NET !$HOME_NET
# Именованные группы портов делают сигнатуры читаемее и проще для изменения.
portvar HTTP_PORTS [80,8080]
portvar SSH_PORTS 22
# Путь нужен при подключении внешних rule-файлов в расширенной конфигурации.
var RULE_PATH /etc/snort/rules

# Проверять контрольные суммы пакетов и писать компактные текстовые оповещения.
config checksum_mode: all
output alert_fast: alert

# Локальные SID начинаются с 1000000. Первая сигнатура замечает ICMP burst,
# вторая — пять и более новых SSH SYN от одного источника за одну секунду.
# Это учебные пороги: перед production-наблюдением их следует откалибровать.
alert icmp any any -> $HOME_NET any (msg:"LPIC103 ICMP burst"; detection_filter:track by_src,count 100,seconds 1; sid:1000001; rev:2;)
alert tcp $EXTERNAL_NET any -> $HOME_NET $SSH_PORTS (msg:"LPIC103 SSH SYN burst"; flags:S; detection_filter:track by_src,count 5,seconds 1; sid:1000002; rev:2;)
