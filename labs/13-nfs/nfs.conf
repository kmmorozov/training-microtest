# Полный /etc/nfs.conf для учебного NFSv4 сервера.
# Не содержит host-specific UUID/rootfs: прочие параметры имеют штатные defaults.
[nfsd]
# Только v4.1/v4.2, TCP2049; v3/mountd-protocol клиенту не нужен.
vers3 = n
vers4 = y
vers4.0 = n
vers4.1 = y
vers4.2 = y
tcp = y
udp = n
threads = 8
[mountd]
# Экспортные правила читаются из /etc/exports и полных файлов exports.d.
manage-gids = y
