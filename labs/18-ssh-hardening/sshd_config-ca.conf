# Полный /etc/ssh/sshd_config для выделенной учебной SSH-ВМ.
# Include отсутствует: нет скрытого first-value-wins из прежних drop-ins.
Port 22
AddressFamily any
ListenAddress 0.0.0.0
# Создаются ssh-keygen -A на сервере; приватные host keys не покидают сервер.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
SyslogFacility AUTH
LogLevel VERBOSE
PermitRootLogin no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
TrustedUserCAKeys /etc/ssh/lpic103_user_ca.pub
PasswordAuthentication no
PermitEmptyPasswords no
UsePAM yes
AllowGroups ssh-users
MaxAuthTries 6
LoginGraceTime 1m
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowTcpForwarding yes
Subsystem sftp internal-sftp
# Первый этап: только ключ/сертификат, TOTP еще не требуется.
KbdInteractiveAuthentication no
AuthenticationMethods publickey
