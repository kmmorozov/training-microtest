# Второй drop-in применяется только после успешного certificate/FIDO2 входа.
# До reload: резервная сессия, настроенный /etc/pam.d/sshd, sshd -t и sshd -T.
UsePAM yes
# Первый обязательный этап — любой разрешенный public key/certificate.
PubkeyAuthentication yes
# Второй этап вызывает PAM stack через keyboard-interactive.
KbdInteractiveAuthentication yes
# Запятая означает последовательное AND: publickey, затем TOTP через PAM.
AuthenticationMethods publickey,keyboard-interactive:pam
