# Финальный drop-in применяется только после двух успешных MFA-сеансов.
# Ошибка может закрыть удаленный доступ: не закрывайте резервную консоль до тестов.
# Прямой удаленный вход root запрещен.
PermitRootLogin no
# System password не используется как SSH authentication method.
PasswordAuthentication no
# Keys/certificates и PAM TOTP остаются включены для AuthenticationMethods выше.
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
# Доступ получают только пользователи с проверенным членством в ssh-users.
AllowGroups ssh-users
