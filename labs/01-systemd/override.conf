# Установить как /etc/systemd/system/lpic103-demo.service.d/override.conf.
# Drop-in сохраняет основной unit неизменным и сопровождаемым.
[Service]
# Пустое присваивание сначала сбрасывает список Environment из основного unit.
Environment=
# Новое значение уменьшает интервал журналирования до трех секунд.
Environment=INTERVAL=3
