// Полный /etc/named.conf: authoritative-only DNS для отдельной ВМ Rocky 9/10.
// Не требует ручного добавления options/zones; ключ rndc устанавливается отдельно.
options {
    directory "/var/named";
    // Адрес .53 заранее должен быть назначен лабораторному интерфейсу.
    listen-on port 53 { 127.0.0.1; 192.168.10.53; };
    listen-on-v6 { none; };
    allow-query { localhost; 192.168.10.0/24; };
    // Этот сервер не является рекурсивным resolver для Интернета.
    recursion no;
    allow-transfer { none; };
    // Пакетный writable runtime directory.
    pid-file "/run/named/named.pid";
};
// Локальная аутентификация rndc; этот секрет генерирует rndc-confgen, не Git.
include "/etc/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};
zone "example.test" {
    type master;
    file "db.example.test";
    // Обновления выполняются вручную с увеличением SOA serial.
    allow-update { none; };
};
zone "10.168.192.in-addr.arpa" {
    type master;
    file "db.192.168.10";
    allow-update { none; };
};
