// Полный /etc/bind/named.conf для Debian/Ubuntu: не включает пакетные фрагменты.
// Зоны находятся в /etc/bind; cache directory принадлежит пользователю bind.
options {
    directory "/var/cache/bind";
    listen-on port 53 { 127.0.0.1; 192.168.10.53; };
    listen-on-v6 { none; };
    allow-query { localhost; 192.168.10.0/24; };
    recursion no;
    allow-transfer { none; };
    pid-file "/run/named/named.pid";
};
// Секрет локального control channel создается rndc-confgen.
include "/etc/bind/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};
zone "example.test" {
    type master;
    file "/etc/bind/db.example.test";
    allow-update { none; };
};
zone "10.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/db.192.168.10";
    allow-update { none; };
};
