# OpenVPN 2.6 client profile: /etc/openvpn/client/lpic103.conf.
# PKI paths абсолютные; private client/tls-crypt keys устанавливаются mode 0600.
# Клиентский режим и route-based TUN, не Ethernet bridge TAP.
client
dev tun
# UDP избегает TCP-over-TCP; endpoint должен разрешаться доверенным DNS.
proto udp
remote vpn.example.test 1194
# Не занимаем фиксированный local source port.
nobind

# CA проверяет issuer; client certificate/key доказывают identity клиента.
ca /etc/openvpn/client/pki/ca.crt
cert /etc/openvpn/client/pki/client.crt
key /etc/openvpn/client/pki/client.key
tls-crypt /etc/openvpn/client/pki/tls-crypt.key
# EKU serverAuth и exact X.509 CN/SAN защищают от сертификата неправильной роли.
remote-cert-tls server
verify-x509-name vpn.example.test name

# Разрешены только современные AEAD ciphers; ChaCha optional для совместимости.
data-ciphers AES-256-GCM:AES-128-GCM:?CHACHA20-POLY1305
# Сохраняем key/TUN state при restart; compression намеренно отсутствует.
persist-key
persist-tun
verb 3
