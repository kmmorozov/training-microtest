# Полный /etc/samba/smb.conf для отдельного файлового сервера, не AD DC.
# Проверка: testparm -s ./smb.conf. Пароли создаются smbpasswd, не хранятся здесь.
[global]
    # Standalone сервер использует локальные UNIX identities и Samba password DB.
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    passdb backend = tdbsam
    # Не переводим неизвестный логин в гостя; SMB1 и старые NetBIOS-порты не нужны.
    map to guest = Never
    server min protocol = SMB2_02
    smb ports = 445
    # Замените сеть одновременно с клиентскими адресами. Loopback нужен для теста.
    interfaces = lo 192.168.10.0/24
    bind interfaces only = yes
    hosts allow = 127.0.0.1 192.168.10.0/24
    # Файловому серверу не требуется публикация принтеров.
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    # Раздельный лог клиента и ограничение размера в KiB.
    log file = /var/log/samba/log.%m
    max log size = 1000
    log level = 1

[team]
    # UNIX owner root, group lpic103-smb, mode 2770; SELinux samba_share_t.
    path = /srv/samba/lpic103-team
    browseable = yes
    read only = no
    guest ok = no
    valid users = @lpic103-smb
    # Все новые объекты принадлежат общей группе; посторонние не читают файлы.
    force group = lpic103-smb
    create mask = 0660
    force create mode = 0660
    directory mask = 2770
    force directory mode = 2770
