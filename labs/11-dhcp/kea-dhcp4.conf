// Полный /etc/kea/kea-dhcp4.conf для Rocky Linux 10, Kea 2.6/3.x.
// Стенд: сервер/шлюз 192.168.10.1, DNS .53, отдельный L2-интерфейс enp0s8.
// Замените интерфейс и адреса согласованно; это JSON с комментариями Kea,
// поэтому проверяйте kea-dhcp4 -t, а не обычным JSON parser.
{
  "Dhcp4": {
    // Не слушать "*" и management/uplink: DHCP должен оставаться в учебном L2.
    "interfaces-config": {
      "interfaces": [ "enp0s8" ],
      // raw обслуживает клиентов без адреса; UDP socket нужен для иных сценариев.
      "dhcp-socket-type": "raw"
    },
    // NAK допустим, только когда мы единственный DHCP-сервер этого сегмента.
    "authoritative": true,
    // T1 < T2 < valid-lifetime: попытка renew через 5 мин, rebind через 8.
    "renew-timer": 300,
    "rebind-timer": 480,
    "valid-lifetime": 600,
    "max-valid-lifetime": 3600,
    // Memfile не требует отдельной SQL БД или пароля; записи сохраняются в CSV.
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      // LFC удаляет старые версии записей; не редактируйте CSV работающего daemon.
      "lfc-interval": 3600
    },
    // Для учебной reservation используем MAC, а не меняющийся client-id.
    "host-reservation-identifiers": [ "hw-address" ],
    "subnet4": [
      {
        // Уникальный стабильный ID подсети участвует в хранении аренды.
        "id": 10,
        "subnet": "192.168.10.0/24",
        "interface": "enp0s8",
        "pools": [ { "pool": "192.168.10.100 - 192.168.10.150" } ],
        "option-data": [
          { "name": "subnet-mask", "data": "255.255.255.0" },
          { "name": "routers", "data": "192.168.10.1" },
          { "name": "domain-name-servers", "data": "192.168.10.53" },
          { "name": "domain-name", "data": "example.test" },
          {
            // RFC 3442, option 121. Hex исключает зависимость от CSV-формата версии.
            // 00 c0 a8 0a 01 = default via 192.168.10.1.
            // 18 c0 a8 14 c0 a8 0a 01 = 192.168.20.0/24 via 192.168.10.1.
            // Клиент с поддержкой 121 игнорирует option 3: default включен и здесь.
            "code": 121,
            "csv-format": false,
            "data": "00c0a80a0118c0a814c0a80a01",
            "always-send": true
          }
        ],
        "reservations": [
          {
            // Замените фиктивный MAC фактическим MAC второго клиента (ip link).
            // Адрес .60 находится вне динамического пула, но внутри подсети.
            "hw-address": "02:00:00:00:00:60",
            "ip-address": "192.168.10.60",
            "hostname": "reserved-client"
          }
        ]
      }
    ],
    "loggers": [
      {
        // stdout попадает в journal systemd; INFO достаточно для обычной приемки.
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
