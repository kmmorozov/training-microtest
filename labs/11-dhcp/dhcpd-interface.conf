# Полный systemd drop-in /etc/systemd/system/dhcpd.service.d/override.conf.
# Только Rocky 9 ISC DHCP: enp0s8 заменить отдельным лабораторным интерфейсом.
[Service]
# Пустой ExecStart сбрасывает команду пакетного unit перед ее полной заменой.
ExecStart=
ExecStart=/usr/sbin/dhcpd -f -cf /etc/dhcp/dhcpd.conf -user dhcpd -group dhcpd --no-pid enp0s8
