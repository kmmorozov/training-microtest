# RHEL-like server config: установить в /etc/nginx/conf.d/lpic103-wp.conf.
# Требует заранее подготовленных document root, PHP-FPM socket и TLS keypair.
server {
    # Plain HTTP используется только для постоянного redirect на тот же Host/URI.
    listen 80;
    server_name wp.example.test;
    return 301 https://$host$request_uri;
}

server {
    # TLS endpoint; HTTP/2 включайте отдельно с учетом версии package Nginx.
    listen 443 ssl;
    server_name wp.example.test;
    # Код root:root, запись web user разрешена только wp-content/uploads.
    root /var/www/lpic103-wp;
    index index.php index.html;

    # Сертификат публичен; private key должен иметь минимальные права.
    ssl_certificate /etc/nginx/lpic103-tls/wp.crt;
    ssl_certificate_key /etc/nginx/lpic103-tls/wp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Front controller: существующие static paths отдаются напрямую, остальные URI
    # передаются WordPress index.php вместе с исходной query string.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        # Несуществующий PHP не передается FPM, что исключает path confusion.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # RHEL pool fragment настраивает именно этот UNIX socket и доступ nginx.
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }
    # Секреты конфигурации и скрытые файлы запрещены отдельными exact/regex rules.
    location = /wp-config.php { deny all; }
    location ~ /\. { deny all; }

    # Раздельные журналы упрощают диагностику одного virtual host.
    access_log /var/log/nginx/lpic103-wp.access.log;
    error_log /var/log/nginx/lpic103-wp.error.log;
}
