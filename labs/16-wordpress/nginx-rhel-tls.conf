# Полный /etc/nginx/nginx.conf для отдельной учебной ВМ.
# Не подключает прежние conf.d/sites-enabled: все server blocks находятся здесь.
# MIME types — стандартный файл пакета nginx, не недостающий фрагмент курса.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events {
    # Лимит соединений на worker; не заменяет лимит открытых файлов ОС.
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    # HTTP сначала переводится на фиксированное имя TLS сайта.
    server {
        listen 80;
        server_name wp.example.test;
        return 301 https://wp.example.test$request_uri;
    }
    server {
        listen 443 ssl;
        server_name wp.example.test;
        root /var/www/lpic103-wp;
        index index.php index.html;
        # Master читает private key как root; ключ mode 0600.
        ssl_certificate /etc/nginx/lpic103-tls/wp.crt;
        ssl_certificate_key /etc/nginx/lpic103-tls/wp.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            try_files $uri $uri/ /index.php?$args;
        }
        # Запрещаем выдачу secrets и выполнение загруженного пользователем PHP.
        location = /wp-config.php { deny all; }
        location ~ /\. { deny all; }
        location ~* ^/wp-content/uploads/.*\.php(?:/|$) { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            # Полный набор FastCGI CGI-параметров, без зависимости от fastcgi_params.
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
            # Не превращать клиентский Proxy header в CGI HTTP_PROXY.
            fastcgi_param HTTP_PROXY "";
        }
    }

}
