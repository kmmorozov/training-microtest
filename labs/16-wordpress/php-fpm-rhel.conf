; Полный /etc/php-fpm.conf для выделенной учебной ВМ Rocky Linux.
; Встроенный pool заменяет /etc/php-fpm.d/www.conf: внешних include здесь нет.
[global]
; systemd получает сообщения с stderr; master остается в foreground.
pid = /run/php-fpm/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
; Один пользователь согласован с nginx.conf и владельцем uploads.
user = nginx
group = nginx
listen = /run/php-fpm/www.sock
; listen.acl_users намеренно не задается: иначе он перекроет owner/group.
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
; ondemand экономит память; максимум пять рабочих процессов на учебной ВМ.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
; Не передавать приложению окружение сервиса и не исполнять другие расширения.
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
; Ограничение uploads согласуйте с client_max_body_size Nginx.
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
