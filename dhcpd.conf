# Рабочий пример ISC DHCP Server для отдельного сегмента 192.0.2.0/24.
# Сеть 192.0.2.0/24 зарезервирована RFC 5737 для документации: перед установкой
# замените ее адресами своего изолированного стенда и выберите нужный интерфейс.
# Проверка без запуска службы: dhcpd -t -cf ./dhcpd.conf

# Сервер объявляется авторитетным и может отправлять DHCPNAK неверным клиентам.
# Не включайте этот режим в сети, где уже работает чужой DHCP-сервер.
authoritative;
# Длительности аренды задаются в секундах: 10 минут по умолчанию, максимум час.
default-lease-time 600;
max-lease-time 3600;
# Эти параметры получит каждый клиент описанной ниже подсети.
option domain-name "example.test";
option domain-name-servers 192.0.2.53;

# Динамический пул занимает только .100-.150; шлюз и DNS находятся вне пула.
subnet 192.0.2.0 netmask 255.255.255.0 {
    range 192.0.2.100 192.0.2.150;
    option routers 192.0.2.1;
    option subnet-mask 255.255.255.0;
}

# Пример статической привязки: один и тот же MAC всегда получает адрес .60.
# MAC фиктивный; замените его фактическим адресом учебной машины.
host reserved-client {
    hardware ethernet 02:00:00:00:00:60;
    fixed-address 192.0.2.60;
}
