# Минимальный основной конфиг Nginx для RHEL-like систем.
# Проверьте перед установкой: nginx -t -c "$PWD/nginx.conf" (пути должны существовать).
# Для Debian-like замените пользователя nginx на www-data и учитывайте штатную
# структуру sites-enabled. Комментарии Nginx должны занимать отдельную строку.

# Master-процесс запускает workers от непривилегированного системного пользователя.
user nginx;
# auto создает worker по числу доступных процессору ядер.
worker_processes auto;
error_log /var/log/nginx/error.log;
# PID используется systemd и утилитой nginx для передачи сигналов master-процессу.
pid /run/nginx.pid;

events {
    # Максимум соединений на worker; фактический предел также зависит от ulimit -n.
    worker_connections 1024;
}

http {
    # Таблица MIME нужна, чтобы CSS, JS и изображения получали верный Content-Type.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Именованный формат main фиксирует клиента, запрос, ответ, referer и user-agent.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    # sendfile передает статические файлы эффективнее; keepalive переиспользует TCP.
    sendfile on;
    keepalive_timeout 65;

    # Default server раздает статические файлы из /var/www/html по HTTP.
    server {
        listen 80;
        # Подчеркивание — заведомо обычное имя-заглушка, а не wildcard-синтаксис.
        server_name _;
        root /var/www/html;
        index index.html;
        # Ищем файл/каталог и возвращаем 404 вместо неявного проксирования.
        location / { try_files $uri $uri/ =404; }
    }

    # Прикладные virtual host следует хранить отдельными файлами в conf.d.
    include /etc/nginx/conf.d/*.conf;
}
