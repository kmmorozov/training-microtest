# Совместимый пример OpenVPN 2.6. Лабораторный шаблон: labs/19-openvpn/.
# Это серверный конфиг; установите его в каталог server вашей ОС и защитите
# server.key/tls-crypt.key правами 0600. Сеть и маршруты ниже учебные.
# Проверка конфигурации описана в labs/19-openvpn/README.md.

# UDP обычно эффективнее поверх VPN; firewall должен разрешать 1194/udp.
port 1194
proto udp
# tun создает L3-туннель, а topology subnet выдает клиентам обычные IPv4-адреса.
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
# CA проверяет клиентов, server cert/key представляют сам VPN-сервер.
ca /etc/openvpn/server/pki/ca.crt
cert /etc/openvpn/server/pki/server.crt
key /etc/openvpn/server/pki/server.key
# Современные сертификаты не требуют статических DH-параметров.
dh none
# Общий статический ключ защищает управляющий канал до TLS-аутентификации.
tls-crypt /etc/openvpn/server/pki/tls-crypt.key
verify-client-cert require
# Только AEAD-наборы; ? делает ChaCha20 необязательным для разных сборок OpenVPN.
data-ciphers AES-256-GCM:AES-128-GCM:?CHACHA20-POLY1305
# Клиенты получат маршрут в учебную LAN; серверу нужны forwarding и firewall/NAT.
push "route 192.0.2.0 255.255.255.0"
# Ping каждые 10 секунд, переподключение при отсутствии ответа 60 секунд.
keepalive 10 60
persist-key
persist-tun
# UDP-сервер сообщает клиенту о штатном завершении.
explicit-exit-notify 1
verb 3
